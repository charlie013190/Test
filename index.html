<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 2rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      background: #4ade80;
      color: #14532d;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 24px 0;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
    }

    .card h3 {
      font-size: 0.9rem;
      color: #334155;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin: 0;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #4f46e5;
    }

    #output {
      margin-top: 16px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #334155;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Page</h1>
    <span class="badge">HTML Ready</span>

    <p>This is a test HTML page. Everything is working correctly.</p>

    <div class="card-grid">
      <div class="card">
        <h3>HTML5</h3>
        <p>Semantic markup</p>
      </div>
      <div class="card">
        <h3>CSS3</h3>
        <p>Modern styling</p>
      </div>
      <div class="card">
        <h3>Responsive</h3>
        <p>Mobile friendly</p>
      </div>
      <div class="card">
        <h3>JavaScript</h3>
        <p>Interactive elements</p>
      </div>
    </div>

    <button onclick="runTest()">Run Test</button>
    <div id="output"></div>
  </div>

  <script>
    function runTest() {
      const output = document.getElementById('output');
      const results = [
        'HTML parsing... OK',
        'CSS rendering... OK',
        'JavaScript execution... OK',
        'DOM manipulation... OK',
        '',
        'All tests passed!',
      ];

      output.style.display = 'block';
      output.textContent = '';

      let i = 0;
      const interval = setInterval(() => {
        if (i < results.length) {
          output.textContent += results[i] + '\n';
          i++;
        } else {
          clearInterval(interval);
        }
      }, 200);
    }
  </script>
</body>
</html>
